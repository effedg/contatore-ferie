<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Ferie - OSS Luigia Mattei</title>
    <style>
        :root {
            --bg-color: #fdf2f8; /* Rosa chiarissimo */
            --nav-bg: #fbcfe8; /* Rosa pastello */
            --primary: #db2777; /* Rosa scuro / Fucsia */
            --text-main: #831843; /* Borgogna */
            --card-bg: #ffffff;
            --requested: #fef08a; /* Giallo pastello */
            --approved: #bbf7d0; /* Verde pastello */
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        /* Navbar */
        nav {
            background-color: var(--nav-bg);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .profile-container {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .profile-pic {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: white;
            border: 3px solid var(--primary);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile-pic img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        nav h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--text-main);
            letter-spacing: 1px;
        }

        /* Main Content */
        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* Widgets */
        .widgets {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            flex: 1;
            min-width: 250px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border-top: 5px solid var(--primary);
            text-align: center;
        }

        .card h2 {
            margin-top: 0;
            font-size: 1.1rem;
            color: #9d174d;
        }

        .card .number {
            font-size: 3rem;
            font-weight: bold;
            color: var(--primary);
            margin: 10px 0;
        }

        .card .subtitle {
            font-size: 0.85rem;
            color: #666;
        }

        /* Calendar Section */
        .calendar-section {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-header button {
            background-color: var(--nav-bg);
            border: none;
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .calendar-header button:hover {
            background-color: #f9a8d4;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .day-name {
            text-align: center;
            font-weight: bold;
            padding: 10px 0;
            color: var(--primary);
        }

        .day {
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fdf8fa;
            border: 1px solid #fce7f3;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.2s;
            user-select: none;
        }

        .day:hover:not(.empty) {
            transform: scale(1.05);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .day.empty {
            background-color: transparent;
            border: none;
            cursor: default;
        }

        .day.requested {
            background-color: var(--requested);
            border-color: #eab308;
            color: #854d0e;
            font-weight: bold;
        }

        .day.approved {
            background-color: var(--approved);
            border-color: #22c55e;
            color: #166534;
            font-weight: bold;
        }

        .legend {
            margin-top: 20px;
            display: flex;
            gap: 20px;
            justify-content: center;
            font-size: 0.9rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-color {
            width: 15px;
            height: 15px;
            border-radius: 3px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

    <nav>
        <div class="profile-container">
            <div class="profile-pic">
                <img src="luigia-m.jpg" alt="Foto Luigia Mattei">
            </div>
            <h1>OSS LUIGIA MATTEI</h1>
        </div>
    </nav>

    <div class="container">
        <div class="widgets">
            <div class="card">
                <h2>Ferie Disponibili</h2>
                <div class="number" id="ferie-disponibili">10</div>
               
            </div>

            <div class="card" style="border-top-color: #8b5cf6;">
                <h2 style="color: #5b21b6;">Ferie Estive</h2>
                <div class="number" style="color: #8b5cf6;">14</div>
                <div class="subtitle">Giorni fissi dedicati al periodo estivo.</div>
            </div>
        </div>

        <div class="calendar-section">
            <div class="calendar-header">
                <button onclick="changeMonth(-1)">&#8592; Mese Prec</button>
                <h2 id="month-year-display"></h2>
                <button onclick="changeMonth(1)">Mese Succ &#8594;</button>
            </div>

            <div class="calendar-grid" id="calendar"></div>

            <div class="legend">
                <div class="legend-item"><div class="legend-color" style="background-color: #fdf8fa;"></div> Libero</div>
                <div class="legend-item"><div class="legend-color" style="background-color: var(--requested); border-color: #eab308;"></div> Richiesto</div>
                <div class="legend-item"><div class="legend-color" style="background-color: var(--approved); border-color: #22c55e;"></div> Approvato</div>
            </div>
        </div>
    </div>

    <script>
        let now = new Date();
        let currentMonth = now.getMonth();
        let currentYear = now.getFullYear();
        let displayMonth = currentMonth;
        let displayYear = currentYear;

        let data = JSON.parse(localStorage.getItem('luigiaFerieData'));

        // Se i dati non esistono o la base è ancora vecchia, inizializziamo a 10
        if (!data || data.baseFerie === 24) {
            data = {
                baseFerie: 10, 
                lastIncrementMonth: now.getDate() >= 5 ? currentMonth : currentMonth - 1,
                lastIncrementYear: currentYear,
                daysStatus: data ? data.daysStatus : {} // Mantieni i giorni segnati se presenti
            };
            localStorage.setItem('luigiaFerieData', JSON.stringify(data));
        }

        function checkMonthlyIncrements() {
            let limit = 0;
            while (limit < 100) {
                let nextMonth = data.lastIncrementMonth + 1;
                let nextYear = data.lastIncrementYear;
                if (nextMonth > 11) {
                    nextMonth = 0;
                    nextYear++;
                }
                let targetDate = new Date(nextYear, nextMonth, 5);
                if (now.getTime() >= targetDate.getTime()) {
                    data.baseFerie += 2;
                    data.lastIncrementMonth = nextMonth;
                    data.lastIncrementYear = nextYear;
                } else {
                    break;
                }
                limit++;
            }
            saveData();
        }

        function saveData() {
            localStorage.setItem('luigiaFerieData', JSON.stringify(data));
        }

        function updateFerieDisplay() {
            let approvedCount = Object.values(data.daysStatus).filter(status => status === 'approved').length;
            let ferieDisponibili = data.baseFerie - approvedCount;
            document.getElementById('ferie-disponibili').innerText = ferieDisponibili;
        }

        const monthNames = ["Gennaio", "Febbraio", "Marzo", "Aprile", "Maggio", "Giugno", "Luglio", "Agosto", "Settembre", "Ottobre", "Novembre", "Dicembre"];

        function renderCalendar(month, year) {
            const calendarGrid = document.getElementById('calendar');
            calendarGrid.innerHTML = '';
            const daysOfWeek = ['Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab', 'Dom'];
            daysOfWeek.forEach(day => {
                const div = document.createElement('div');
                div.classList.add('day-name');
                div.innerText = day;
                calendarGrid.appendChild(div);
            });

            document.getElementById('month-year-display').innerText = `${monthNames[month]} ${year}`;

            let firstDay = new Date(year, month, 1).getDay() - 1;
            if (firstDay === -1) firstDay = 6;
            let daysInMonth = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.classList.add('day', 'empty');
                calendarGrid.appendChild(emptyDiv);
            }

            for (let i = 1; i <= daysInMonth; i++) {
                const dayDiv = document.createElement('div');
                dayDiv.classList.add('day');
                dayDiv.innerText = i;
                let dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                let status = data.daysStatus[dateStr];
                if (status) dayDiv.classList.add(status);

                dayDiv.onclick = function() {
                    let currentStatus = data.daysStatus[dateStr];
                    if (!currentStatus) {
                        data.daysStatus[dateStr] = 'requested';
                    } else if (currentStatus === 'requested') {
                        data.daysStatus[dateStr] = 'approved';
                    } else if (currentStatus === 'approved') {
                        delete data.daysStatus[dateStr];
                    }
                    saveData();
                    renderCalendar(displayMonth, displayYear);
                    updateFerieDisplay();
                };
                calendarGrid.appendChild(dayDiv);
            }
        }

        function changeMonth(direction) {
            displayMonth += direction;
            if (displayMonth < 0) { displayMonth = 11; displayYear--; }
            else if (displayMonth > 11) { displayMonth = 0; displayYear++; }
            renderCalendar(displayMonth, displayYear);
        }

        checkMonthlyIncrements();
        renderCalendar(displayMonth, displayYear);
        updateFerieDisplay();
    </script>
</body>
</html>
